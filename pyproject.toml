[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automil"
version = "0.1.0"
description = "Automated Multiple Instance Learning pipeline for whole slide image analysis"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [
    {name = "Jonas Waibel", email = "Waibel.Jonas@kabelmail.de"},
]
keywords = [
    "machine-learning",
    "medical-imaging",
    "multiple-instance-learning",
    "whole-slide-imaging",
    "computational-pathology",
    "automl",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.2.0",
    "nystrom-attention>=0.0.14",  # Required by slideflow's TransMIL
    "openslide-bin>=4.0.0.8",
    "openslide-python>=1.4.2",
    "slideflow>=3.0.2",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "fastai>=2.7.0",
    "ipython>=8.0.0",
    "cucim>=0.3.0; sys_platform == 'linux'",  # Default slideflow slide backend, Linux only
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
vips = [
  "pyvips>=3.0.0",
]

test = [
  "pytest",
  "pytest-cov>=6.1",  # markdown coverage reports
]

dev = [
  "automil[test]",
  "ruff",
  "mypy",
  "pre-commit",
]

[project.urls]
Homepage = "https://github.com/frankkramer-lab/AutoMIL"
Documentation = "https://frankkramer-lab.github.io/AutoMIL/"
Repository = "https://github.com/frankkramer-lab/AutoMIL"
Issues = "https://github.com/frankkramer-lab/AutoMIL/issues"

[project.scripts]
automil = "automil.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["automil"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Lint only; formatting is left to the author (manual alignment is intentional)
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # Line length is not enforced without a formatter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # Package-level re-exports

[tool.mypy]
python_version = "3.11"
files = ["automil"]
# Heavy scientific dependencies (slideflow, torch, fastai, ...) ship without complete type information
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["automil"]

filterwarnings = [
    "ignore::DeprecationWarning:slideflow",
    "ignore::UserWarning:slideflow\\.plugin",
    "ignore::DeprecationWarning:pkg_resources",
    "ignore:the load_module\\(\\) method is deprecated:DeprecationWarning",
    "ignore::FutureWarning:timm\\.models\\.helpers",
    "ignore::FutureWarning:timm\\.models\\.layers",
]

[tool.hatch.build.targets.sdist]
include = [
    "/automil",
    "/README.md",
    "/pyproject.toml",
]
